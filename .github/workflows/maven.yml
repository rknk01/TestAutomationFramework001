name: Test Automation Workflow

on:
  schedule:
  - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running Test Automation Framework
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Test logs
        path: logs/

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Test Reports
        path: report.html

    - name: Test Execustion Status
      run: echo " Test Execution Completed"
        

  
